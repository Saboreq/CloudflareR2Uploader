name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-package:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Restore, build, test, and package
        shell: pwsh
        env:
          BUILD_VERSION: 0.0.0-ci.${{ github.run_number }}
          UPDATE_BASE_URL: ${{ vars.UPDATE_BASE_URL }}
          UPDATE_PREFIX: ${{ vars.UPDATE_PREFIX }}
        run: |
          $parameters = @{ Version = $env:BUILD_VERSION }
          if ($env:UPDATE_BASE_URL) { $parameters.UpdateBaseUrl = $env:UPDATE_BASE_URL }
          if ($env:UPDATE_PREFIX) { $parameters.UpdatePrefix = $env:UPDATE_PREFIX }
          & .\build\Build-Release.ps1 @parameters
      - name: Upload release package
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: cloudflare-r2-uploader-windows
          path: dist/CloudflareR2Uploader-v*-Setup.exe
          if-no-files-found: error
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults/**/*.trx
          if-no-files-found: error
