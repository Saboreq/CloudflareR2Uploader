name: Tagged release

on:
  push:
    tags:
      - v*.*.*

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --version=6.7.1 --no-progress -y
      - name: Validate tag and derive version
        id: version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $publishableSemanticVersionPattern = '^v(?<version>(?<major>0|[1-9][0-9]*)\.(?<minor>0|[1-9][0-9]*)\.(?<patch>0|[1-9][0-9]*)(?:-(?:(?:0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)(?:\.(?:0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*))*))?)(?![\s\S])'
          $releaseVersionCandidate = if ($null -ne $env:RELEASE_TAG -and $env:RELEASE_TAG.StartsWith('v', [StringComparison]::Ordinal)) {
            $env:RELEASE_TAG.Substring(1)
          } else {
            $null
          }
          if ($null -eq $releaseVersionCandidate -or $releaseVersionCandidate.Length -gt 128 -or
              $env:RELEASE_TAG -notmatch $publishableSemanticVersionPattern) {
            throw "Unsupported release tag: $env:RELEASE_TAG"
          }
          $versionMajor = [uint16]0
          $versionMinor = [uint16]0
          $versionPatch = [uint16]0
          if (-not [uint16]::TryParse($Matches.major, [Globalization.NumberStyles]::None, [Globalization.CultureInfo]::InvariantCulture, [ref]$versionMajor) -or
              -not [uint16]::TryParse($Matches.minor, [Globalization.NumberStyles]::None, [Globalization.CultureInfo]::InvariantCulture, [ref]$versionMinor) -or
              -not [uint16]::TryParse($Matches.patch, [Globalization.NumberStyles]::None, [Globalization.CultureInfo]::InvariantCulture, [ref]$versionPatch)) {
            throw "Release tag cannot be represented by Windows file-version metadata: $env:RELEASE_TAG"
          }
          "version=$($Matches.version)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "prerelease=$($Matches.version.Contains('-').ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Restore, build, test, and package
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          UPDATE_BASE_URL: ${{ vars.UPDATE_BASE_URL }}
          UPDATE_MANIFEST_PUBLIC_KEY: ${{ vars.UPDATE_MANIFEST_PUBLIC_KEY }}
          UPDATE_PREFIX: ${{ vars.UPDATE_PREFIX }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:UPDATE_BASE_URL) -or [string]::IsNullOrWhiteSpace($env:UPDATE_MANIFEST_PUBLIC_KEY)) {
            throw 'Tagged releases require UPDATE_BASE_URL and UPDATE_MANIFEST_PUBLIC_KEY repository variables.'
          }
          $parameters = @{
            Version = $env:RELEASE_VERSION
            UpdateBaseUrl = $env:UPDATE_BASE_URL.Trim()
            UpdateManifestPublicKey = $env:UPDATE_MANIFEST_PUBLIC_KEY.Trim()
            RequireSignedUpdate = $true
          }
          if ($env:UPDATE_PREFIX) { $parameters.UpdatePrefix = $env:UPDATE_PREFIX.Trim() }
          & .\build\Build-Release.ps1 @parameters
      - name: Test release-script security contracts
        shell: pwsh
        run: .\tests\PowerShell\Test-UpdateReleaseScripts.ps1
      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          IS_PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -eq 0) { throw "Release $env:RELEASE_TAG already exists." }
          $installer = "dist/CloudflareR2Uploader-v$env:RELEASE_VERSION-Setup.exe"
          if (-not (Test-Path -LiteralPath $installer)) { throw 'Release installer is missing.' }
          $arguments = @('release','create',$env:RELEASE_TAG,$installer,'--title',"Cloudflare R2 Uploader $env:RELEASE_VERSION",'--generate-notes','--verify-tag')
          if ($env:IS_PRERELEASE -eq 'true') { $arguments += '--prerelease' }
          & gh @arguments
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed with exit code $LASTEXITCODE" }
